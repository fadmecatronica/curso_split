<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculadora Split - Carga Térmica</title>

<style>
    body{
        font-family: Arial;
        background:#f2f2f2;
        margin:20px;
    }

    .contenedor{
        max-width:800px;
        margin:auto;
        background:white;
        padding:25px;
        border-radius:10px;
        box-shadow:0 0 10px rgba(0,0,0,0.2);
    }

    h1{
        text-align:center;
        color:#004b8d;
    }

    label{
        display:block;
        margin-top:12px;
        font-weight:bold;
    }

    input, select{
        width:100%;
        padding:10px;
        margin-top:5px;
        border-radius:5px;
        border:1px solid #ccc;
    }

    button{
        width:100%;
        padding:15px;
        margin-top:20px;
        background:#0077cc;
        color:white;
        border:none;
        border-radius:5px;
        font-size:18px;
        cursor:pointer;
    }

    button:hover{
        background:#005fa3;
    }

    .resultado{
        margin-top:25px;
        background:#eef6ff;
        padding:20px;
        border-radius:10px;
    }

    .ok{
        color:green;
        font-weight:bold;
    }

    .warning{
        color:#cc6600;
        font-weight:bold;
    }

</style>
</head>

<body>

<div class="contenedor">

<h1>Calculadora de Aire Acondicionado Split</h1>

<h2>📝 Datos del ambiente</h2>

<label>Largo (m)</label>
<input type="number" id="largo" step="0.1">

<label>Ancho (m)</label>
<input type="number" id="ancho" step="0.1">

<label>Altura (m)</label>
<input type="number" id="altura" step="0.1">

<label>Personas habituales</label>
<input type="number" id="personas">

<label>Ventanas con sol directo</label>
<input type="number" id="ventanas">

<label>Orientación</label>
<select id="orientacion">
    <option>Sur</option>
    <option>Norte</option>
    <option>Este</option>
    <option>Oeste</option>
</select>

<label>Equipos eléctricos</label>
<input type="number" id="equipos">

<label>Potencia equipo instalado (Watts)</label>
<input type="number" id="watts">

<label>
<input type="checkbox" id="vidriado">
Superficie vidriada grande
</label>

<button onclick="calcular()">CALCULAR</button>

<div class="resultado" id="resultado"></div>

</div>

<script>

function calcular(){

    let largo = parseFloat(document.getElementById("largo").value) || 0;
    let ancho = parseFloat(document.getElementById("ancho").value) || 0;
    let altura = parseFloat(document.getElementById("altura").value) || 0;
    let personas = parseInt(document.getElementById("personas").value) || 0;
    let ventanas = parseInt(document.getElementById("ventanas").value) || 0;
    let orientacion = document.getElementById("orientacion").value;
    let equipos = parseInt(document.getElementById("equipos").value) || 0;
    let watts = parseFloat(document.getElementById("watts").value) || 0;
    let vidriado = document.getElementById("vidriado").checked;

    // 1 Superficie
    let superficie = largo * ancho;

    // 2 Volumen
    let volumen = largo * ancho * altura;

    // 3 BTU Base
    let btuBase = superficie * 600;

    // 4 Adicionales

    let adicionalPersonas = 0;
    if(personas > 2){
        adicionalPersonas = (personas - 2) * 600;
    }

    let adicionalVentanas = ventanas * 1000;

    let adicionalOrientacion = 0;
    if(orientacion == "Norte" || orientacion == "Oeste"){
        adicionalOrientacion = btuBase * 0.10;
    }

    let adicionalEquipos = equipos * 500;

    let adicionalVidriado = 0;
    if(vidriado){
        adicionalVidriado = btuBase * 0.10;
    }

    let adicionales =
        adicionalPersonas +
        adicionalVentanas +
        adicionalOrientacion +
        adicionalEquipos +
        adicionalVidriado;

    // 5 Total BTU
    let totalBTU = btuBase + adicionales;

    // 6 Frigorías
    let frigorias = totalBTU / 4;

    // 7 Equipo instalado
    let btuEquipo = watts * 3.412;

    // 8 Diagnóstico

    let diagnostico = "";
    let clase = "";

    if(btuEquipo >= totalBTU * 0.9 && btuEquipo <= totalBTU * 1.1){

        diagnostico = "✅ ADECUADO";
        clase = "ok";

    }else if(btuEquipo < totalBTU * 0.9){

        diagnostico =
        "⚠️ SUBDIMENSIONADO<br>" +
        "Consecuencia: trabaja forzado, mayor consumo, enfría mal y se daña antes.";

        clase = "warning";

    }else if(btuEquipo > totalBTU * 1.2){

        diagnostico =
        "⚠️ SOBREDIMENSIONADO<br>" +
        "Consecuencia: ciclos cortos, no deshumidifica bien y desgaste prematuro.";

        clase = "warning";

    }else{

        diagnostico = "⚠️ Levemente sobredimensionado";
        clase = "warning";
    }

    // Mostrar resultados

    document.getElementById("resultado").innerHTML = `

    <h2>Resultados</h2>

    <h3>1. Superficie</h3>
    ${largo} × ${ancho} = <b>${superficie.toFixed(2)} m²</b>

    <h3>2. Volumen</h3>
    ${largo} × ${ancho} × ${altura} =
    <b>${volumen.toFixed(2)} m³</b>

    <h3>3. BTU Base</h3>
    ${superficie.toFixed(2)} × 600 =
    <b>${btuBase.toFixed(0)} BTU/h</b>

    <h3>4. Factores adicionales</h3>

    ✅ Personas:
    ${adicionalPersonas.toFixed(0)} BTU<br><br>

    ✅ Ventanas:
    ${adicionalVentanas.toFixed(0)} BTU<br><br>

    ✅ Orientación:
    ${adicionalOrientacion.toFixed(0)} BTU<br><br>

    ✅ Equipos:
    ${adicionalEquipos.toFixed(0)} BTU<br><br>

    ✅ Vidriado:
    ${adicionalVidriado.toFixed(0)} BTU<br><br>

    <b>Total adicionales:
    ${adicionales.toFixed(0)} BTU/h</b>

    <h3>5. Capacidad Total</h3>

    ${btuBase.toFixed(0)} +
    ${adicionales.toFixed(0)} =
    <b>${totalBTU.toFixed(0)} BTU/h</b>

    <h3>6. Conversión a frigorías</h3>

    ${totalBTU.toFixed(0)} ÷ 4 =
    <b>${frigorias.toFixed(0)} frigorías/h</b>

    <h3>7. Equipo instalado</h3>

    ${watts} × 3.412 =
    <b>${btuEquipo.toFixed(0)} BTU/h</b>

    <h3>8. Diagnóstico</h3>

    <div class="${clase}">
        ${diagnostico}
    </div>

    `;
}

</script>

</body>
</html>
