<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<title>Calculadora Básica</title>

<style>

body{
font-family:Arial;
background:#f2f2f2;
padding:20px;
}

.container{
max-width:900px;
margin:auto;
background:white;
padding:25px;
border-radius:12px;
}

h1{
text-align:center;
color:#0b2c74;
}

label{
display:block;
margin-top:15px;
font-weight:bold;
}

input,select{
width:100%;
padding:10px;
margin-top:5px;
}

button{
width:100%;
padding:15px;
margin-top:20px;
background:#0d6efd;
color:white;
border:none;
font-size:18px;
}

.resultado{
margin-top:20px;
background:#eef5ff;
padding:20px;
border-radius:10px;
}

</style>

</head>

<body>

<div class="container">

<h1>CALCULADORA SPLIT - BÁSICA</h1>

<label>Largo</label>
<input type="number" id="largo">

<label>Ancho</label>
<input type="number" id="ancho">

<label>Altura</label>
<input type="number" id="altura">

<label>Personas</label>
<input type="number" id="personas">

<button onclick="calcular()">
CALCULAR
</button>

<div class="resultado" id="resultado"></div>

</div>

<script>

function calcular(){

let largo=
parseFloat(document.getElementById("largo").value)||0;

let ancho=
parseFloat(document.getElementById("ancho").value)||0;

let altura=
parseFloat(document.getElementById("altura").value)||0;

let personas=
parseInt(document.getElementById("personas").value)||0;

let superficie=largo*ancho;

let volumen=largo*ancho*altura;

let btu=superficie*600;

document.getElementById("resultado").innerHTML=`

<h2>RESULTADOS</h2>

Superficie:
<b>${superficie.toFixed(2)} m²</b>

<br><br>

Volumen:
<b>${volumen.toFixed(2)} m³</b>

<br><br>

BTU requeridos:
<b>${btu.toFixed(0)} BTU/h</b>

`;

}

</script>

</body>
</html>
